<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#C8B89A"/>
      <stop offset="100%" stop-color="#FF2D55"/>
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#C8B89A"/>
      <stop offset="50%"  stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#8FAEC0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="315" x2="1200" y2="315" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.05"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.05"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#accent)"/>

  <!-- Brand mark — circular logo hint -->
  <circle cx="600" cy="220" r="56" fill="none" stroke="#C8B89A" stroke-width="1.5" stroke-opacity="0.4"/>
  <circle cx="600" cy="220" r="40" fill="none" stroke="#FF2D55" stroke-width="1" stroke-opacity="0.25"/>
  <circle cx="600" cy="220" r="8"  fill="#FF2D55" fill-opacity="0.8"/>
  <!-- Eye shape for SIGHT hint -->
  <path d="M570,220 Q600,196 630,220 Q600,244 570,220Z" fill="none" stroke="#C8B89A" stroke-width="1.5" stroke-opacity="0.5"/>
  <!-- Sound wave for HEARING hint -->
  <path d="M583,212 Q583,228 583,228" stroke="#8FAEC0" stroke-width="1.2" stroke-opacity="0" fill="none"/>

  <!-- Brand name -->
  <text
    x="600" y="316"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="96"
    font-weight="400"
    letter-spacing="8"
    text-anchor="middle"
    fill="url(#brand)"
  >Senses</text>

  <!-- Tagline -->
  <text
    x="600" y="368"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="22"
    font-weight="300"
    letter-spacing="6"
    text-anchor="middle"
    fill="#ffffff"
    fill-opacity="0.45"
  >SEE MORE · HEAR MORE · FEEL MORE</text>

  <!-- Division badges -->
  <rect x="450" y="408" width="130" height="36" rx="18" fill="#C8B89A" fill-opacity="0.12" stroke="#C8B89A" stroke-width="1" stroke-opacity="0.4"/>
  <text x="515" y="431" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="3" text-anchor="middle" fill="#C8B89A" fill-opacity="0.9">SIGHT</text>

  <rect x="620" y="408" width="130" height="36" rx="18" fill="#8FAEC0" fill-opacity="0.12" stroke="#8FAEC0" stroke-width="1" stroke-opacity="0.4"/>
  <text x="685" y="431" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="3" text-anchor="middle" fill="#8FAEC0" fill-opacity="0.9">HEARING</text>

  <!-- Domain -->
  <text
    x="600" y="560"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="18"
    font-weight="400"
    letter-spacing="2"
    text-anchor="middle"
    fill="#ffffff"
    fill-opacity="0.28"
  >senses.dhurta.org</text>

  <!-- Bottom accent line -->
  <rect x="0" y="627" width="1200" height="3" fill="url(#accent)" opacity="0.5"/>
</svg>
